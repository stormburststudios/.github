name: Dev Issue
description: Raise a task, feature, or bug for engineering
body:
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Backlog
        - To do
        - In progress
        - Pull Request
        - Live - Test
        - Done
        - Won't do
        - Waiting Room
      default: 1
    validations:
      required: false

  - type: dropdown
    id: task-or-bug
    attributes:
      label: Task or bug
      options:
        - Task
        - Bug
        - Hotfix
      default: 0
    validations:
      required: false

  - type: dropdown
    id: type-of-work
    attributes:
      label: Type of work
      options:
        - Roadmap - Expansion
        - Roadmap - Enhancements
        - Roadmap - Innovation
        - Integrations
        - KTLO/ Bugs
        - Other
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done, or what's the problem?
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: What does "done" look like for this?
    validations:
      required: false

  - type: textarea
    id: bug-cause
    attributes:
      label: If this is a bug, what was it caused by?
      description: Leave blank if this isn't a bug. Add PR link if it was caused by another PR.
    validations:
      required: false
